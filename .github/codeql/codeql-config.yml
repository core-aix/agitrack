name: aGiTrack CodeQL config

# Scanning vendored or generated code produces findings nobody can act on: they are not our
# lines to fix, and they bury the ones that are.
paths-ignore:
  # Dev-only dependencies of the VS Code extension. They ship in nothing, and their advisories
  # are out of scope per SECURITY.md.
  - editors/vscode/node_modules
  # Local virtualenv and build output, present on a developer checkout rather than in git.
  - .venv
  - dist
  - "**/__pycache__"
  # The public website: static pages plus the exported dashboard demo, whose JavaScript is
  # generated by agitrack/metrics/export.py. Scan the generator, not its output.
  - docs
  # The test suite deliberately constructs hostile inputs (crafted branch names, fake secrets,
  # traversal-shaped paths) to prove the real code refuses them. Those are fixtures, not flaws.
  - tests
