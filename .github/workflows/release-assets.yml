name: Release assets

# Finish a release whose automatic run stopped part-way, without cutting a new one.
# Re-running the release workflow itself is not an option: it bumps the version and
# publishes to PyPI first, and a version can be published only once. This builds from the
# release's own tag, so what it ships matches what was released.
#
#   gh workflow run release-assets.yml -f version=0.6.23
#   gh workflow run release-assets.yml -f version=0.6.23 -f msi=false   # extension only

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to finish, without the leading v (e.g. 0.6.23)"
        required: true
        type: string
      msi:
        description: "Build the Windows MSI and attach it to the release"
        type: boolean
        default: true
      vscode:
        description: "Publish the VSCode extension to the Marketplace"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  check:
    name: Check the release exists
    runs-on: ubuntu-latest
    steps:
      - name: Release v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release view "v${VERSION}" --repo "${{ github.repository }}" --json tagName,assets

  vscode:
    name: Publish VSCode extension
    needs: check
    if: ${{ inputs.vscode }}
    runs-on: ubuntu-latest
    env:
      VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: The token is set
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            echo "::error::The VSCE_TOKEN repository secret is not set."
            exit 1
          fi

      - name: The extension is at the released version
        working-directory: editors/vscode
        env:
          VERSION: ${{ inputs.version }}
        run: |
          have=$(node -p "require('./package.json').version")
          if [ "$have" != "$VERSION" ]; then
            echo "::error::editors/vscode/package.json is $have at tag v$VERSION, not $VERSION."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Publish
        working-directory: editors/vscode
        run: |
          npm install --no-audit --no-fund
          npm run compile
          npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_TOKEN"

  msi:
    needs: check
    if: ${{ inputs.msi }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-msi.yml
    with:
      version: ${{ inputs.version }}
      ref: v${{ inputs.version }}
