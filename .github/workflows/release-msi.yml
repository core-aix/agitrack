name: Build + attach Windows MSI

# The one definition of the Windows MSI build, called by every release path:
# release-patch.yml (merge to main), release-tag.yml (a pushed v* tag) and
# release-assets.yml (finishing a release by hand). It used to be copied into each, which
# is how three copies drift.
#
# It has to be CALLED from the releasing run rather than triggered by the release: a
# tag/release created with GITHUB_TOKEN does NOT trigger other workflows, so a separate
# tag-triggered MSI workflow never fired.

on:
  workflow_call:
    inputs:
      version:
        description: "The released version, without the leading v (e.g. 0.6.23)"
        required: true
        type: string
      ref:
        description: "What to build from: main after a patch release, or the release tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-msi:
    name: Build + attach Windows MSI
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install runtime + build deps
        run: uv sync --group build

      - name: Resolve MSI name
        id: msi
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          echo "MSI_NAME=agitrack-$ver-windows-x64.msi" >> $env:GITHUB_OUTPUT

      - name: Build with PyInstaller
        run: uv run pyinstaller installer/agitrack.spec -y

      - name: Smoke-test bundled EXE
        run: dist\agitrack\agitrack.exe --version

      - name: Install WiX v5
        # WiX v5 is required for the <Files> harvest element in agitrack.wxs (v4 lacks it).
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add WiX UI extension
        # Pin the UI extension to the SAME version as the wix tool. Unpinned, `wix
        # extension add` pulls the latest (a newer major), which the toolset can't load —
        # `wix build` then fails with WIX0144 "extension could not be found".
        run: wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build MSI
        # -arch x64: the PyInstaller bundle is 64-bit, so the MSI must be too (else
        # ProgramFiles64Folder doesn't resolve and files install to the wrong place).
        run: |
          wix build `
            installer\agitrack.wxs `
            -arch x64 `
            -d Version=${{ inputs.version }} `
            -d SourceDir=${{ github.workspace }}\dist\agitrack `
            -ext WixToolset.UI.wixext `
            -o dist\${{ steps.msi.outputs.MSI_NAME }}

      - name: Attach MSI to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ inputs.version }}" "dist/${{ steps.msi.outputs.MSI_NAME }}" --clobber
