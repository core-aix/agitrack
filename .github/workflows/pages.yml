# Builds and deploys the public site (agitrack.core-aix.org): the docs/ landing pages plus
# a freshly generated static demo dashboard (`agitrack -d export`) under /dashboard/, so the
# demo is the repository's real, current history on every push to main.
#
# Requires the repository's Pages settings to use the "GitHub Actions" source. If they are
# ever switched to the legacy main:/docs branch build, THAT builder publishes docs/ alone and
# silently drops the generated /dashboard/ demo (it has happened) - and because it shares this
# workflow's "pages" concurrency group it can even deploy last and overwrite this run. The
# "Enforce the workflow build source" step below therefore re-asserts it on every deploy;
# actions/configure-pages only enables Pages, it does not flip an existing legacy source.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NOT cancel-in-progress, matching GitHub's own Pages workflow template: a deployment here is a
  # production publish, and killing one that has already handed off to the Pages API leaves the
  # run failed ("Deployment cancelled.") rather than merely abandoning a build. Pushes to main
  # land in bursts (aGiTrack commits per turn), so the window for that is real. Queueing instead
  # lets the in-flight publish finish, and GitHub skips all but the newest run waiting behind it,
  # so the site still converges on the latest commit without a wasted deploy.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The demo dashboard is computed from the FULL commit history.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install aGiTrack (this checkout)
        run: pip install .
      - name: Build the static demo dashboard
        run: |
          # The learn page's demo profile and the storyline's chapters: curated fixtures
          # (real agent output for this repo, checked in) seeded into the stores the export
          # reads. A missing fixture fails the build rather than deploying an empty page.
          mkdir -p .agitrack
          cp docs/demo/learning.json .agitrack/learning.json
          cp docs/demo/story.json .agitrack/story.json
          agitrack -d export --export-dir "$RUNNER_TEMP/site/dashboard"
      - name: Assemble the site (docs + demo dashboard)
        run: cp -R docs/. "$RUNNER_TEMP/site/"
      - name: Verify the demo is in the site
        run: |
          test -f "$RUNNER_TEMP/site/dashboard/index.html"
          test -f "$RUNNER_TEMP/site/dashboard/learn/index.html"
          test -f "$RUNNER_TEMP/site/dashboard/story/index.html"
          test -s "$RUNNER_TEMP/site/dashboard/demo/story.json"
          test -f "$RUNNER_TEMP/site/index.html"
      - name: Enforce the workflow build source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo "")
          if [ "$current" = "workflow" ]; then
            echo "Pages already builds from this workflow."
          else
            echo "::warning::Pages build_type is '${current:-unset}' (the legacy branch build \
          publishes docs/ only and drops /dashboard/); switching it to 'workflow'."
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
              || echo "::error::could not switch the Pages source to 'workflow' - set it by hand \
          under Settings > Pages > Build and deployment > Source: GitHub Actions."
          fi
      - uses: actions/configure-pages@v6
      # The artifact name carries the ATTEMPT number so this workflow can be re-run.
      #
      # Re-running a failed Pages run re-executes the whole job, upload included — and artifacts
      # accumulate across attempts of one run rather than replacing each other. With the default
      # fixed name the second attempt therefore leaves TWO artifacts called "github-pages", and
      # `deploy-pages` refuses to pick one ("Multiple artifacts named "github-pages" were
      # unexpectedly found for this workflow run"). So the retry for a deploy that failed while
      # queued — the one case where re-running is exactly the right thing — could never work, and
      # each attempt made the run permanently un-deployable. One name per attempt keeps every
      # attempt self-contained; `deploy-pages` resolves the name to an artifact id, so the Pages
      # API never sees the name at all.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # 30 minutes, up from the 10-minute default. GitHub parks a deployment in
          # `deployment_queued` and only then starts publishing; when that queue is slow the
          # default expires mid-wait, and the action then CANCELS the deployment it was waiting
          # for — a queue delay is reported as a failed deploy. Waiting longer costs only runner
          # minutes on a bad day and turns those into successful publishes.
          timeout: 1800000
